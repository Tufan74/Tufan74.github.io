<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortier-Algorithmen Visualizer</title>
    <link rel="stylesheet" href="sortier.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
 
    <link id="prism-light" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" disabled>
    <link id="prism-dark" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">


</head>
<body>
   <header>
    <nav>
        <!-- Toggle Button links -->
        <button id="theme-toggle">🌙</button>

        <!-- Zurück-Link rechts -->
        <ul class="nav-links">
            <li><a href="../index.html" target="_blank" rel="noopener noreferrer">zurück</a></li>
        </ul>
    </nav>
</header>


    <div class="container">
        <h1>Sortier-Algorithmen Visualizer</h1>

        <div class="controls">
            <label for="arraySize">Array Größe:</label>
            <input type="number" id="arraySize" value="20" min="5" max="100">
            
            <label for="speed">Geschwindigkeit (ms):</label>
            <input type="number" id="speed" value="100" min="30" max="2000">
            
            <select id="algorithm">
                <option value="bubble">Bubble Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="quick">Quick Sort</option>
                <option value="heap">Heap Sort</option>
            </select>
            
            <button id="generateArray">Array Generieren</button>
            <button id="startSort">Sortieren Starten</button>
        </div>

        <div id="arrayContainer"></div>
    </div>
    
<div class="description-container">
  <h3 id="algo-title">Wähle einen Algorithmus</h3>
  <p id="algo-description">Hier erscheint die Beschreibung zum gewählten Sortieralgorithmus.</p>
</div>


<div class="code-editor">
  <div class="editor-header">
     <span class="red"></span>
    <span class="yellow"></span>
    <span class="green"></span>
  </div>
  <pre><code class="language-python"></code></pre>
</div>
   

    <footer>
        © 2025 Tufan Özdemir
    </footer>

    <script src="sort.js"></script>
</body>
</html>
